<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一生一芯 C 阶段复习与模拟考核工作台：代码导读、验证命令、架构图与题库。"
    />
    <title>YSYX Review Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="复习导航">
        <a class="brand" href="#overview" data-view-link="overview" aria-label="返回复习总览">
          <span class="brand-mark">Y</span>
          <span>
            <strong>YSYX</strong>
            <small>Review Studio</small>
          </span>
        </a>

        <nav class="nav-list" aria-label="主要功能">
          <button class="nav-item active" data-view="overview"><span>◈</span>总览与一周计划</button>
          <button class="nav-item" data-view="chapters"><span>◎</span>C阶段知识库</button>
          <button class="nav-item" data-view="architecture"><span>⌘</span>三张核心架构图</button>
          <button class="nav-item" data-view="commands"><span>›_</span>验证命令实验室</button>
          <button class="nav-item" data-view="quiz"><span>?</span>模拟考核</button>
          <button class="nav-item" data-view="ppt"><span>▣</span>PPT答辩清单</button>
        </nav>

        <section class="sidebar-card progress-card">
          <div class="eyebrow">复习进度</div>
          <div class="progress-number"><strong id="sidebar-progress">0%</strong><span>已完成</span></div>
          <div class="progress-track"><span id="sidebar-progress-bar"></span></div>
          <button class="text-button" id="reset-progress" type="button">重置本机进度</button>
        </section>

        <section class="sidebar-card workspace-card">
          <label for="workspace-root">WSL 工作区路径</label>
          <input id="workspace-root" type="text" value="/home/hjw-arch/ysyx-workbench" spellcheck="false" />
          <label for="wsl-distro">WSL 发行版</label>
          <input id="wsl-distro" type="text" value="Ubuntu" spellcheck="false" />
          <small>文件按钮会使用 <code>vscode://vscode-remote/wsl+…</code>，从 Windows 浏览器直接进入 VS Code 的 WSL Remote。</small>
        </section>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="view-kicker">C1–C6 · 考核导向复习</p>
            <h1 id="view-title">把代码重新变成你能讲清楚的系统</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="toggle-focus" type="button" title="切换专注模式" aria-label="切换专注模式">◐</button>
            <button class="icon-button mobile-nav" id="toggle-mobile-nav" type="button" title="显示导航" aria-label="显示导航">☰</button>
          </div>
        </header>

        <div id="app" tabindex="-1"></div>
      </main>
    </div>

    <dialog id="detail-dialog" class="detail-dialog">
      <button class="dialog-close" type="button" aria-label="关闭">×</button>
      <div id="dialog-content"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
